<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Cadet 3D Pinball for Windows</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
      font-family: 'Tahoma', 'MS Sans Serif', sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* Container do Jogo */
    #game-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
      overflow: hidden;
    }

    canvas.emscripten {
      border: 0 none;
      background-color: #000000;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      image-rendering: pixelated;
      display: block;
    }

    /* Tela de Carregamento Retrô */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000080;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
    }
    .loading-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .loading-status {
      font-size: 13px;
      color: #00ffcc;
      margin-bottom: 16px;
      font-family: monospace;
    }
    .loading-bar-border {
      width: 220px;
      height: 20px;
      background: #c0c0c0;
      border: 2px inset #ffffff;
      padding: 2px;
      margin-bottom: 10px;
    }
    .loading-bar-fill {
      height: 100%;
      width: 30%;
      background: #000080;
      transition: width 0.3s;
    }

    /* Controles Touch Mobile para Pinball (OCULTOS POR PADRÃO NO COMPUTADOR / DESKTOP) */
    #touch-controls,
    #floating-mute-btn,
    .touch-zone-left,
    .touch-zone-right {
      display: none !important;
    }

    #floating-mute-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 50;
      background: #c0c0c0;
      border: 2px outset #ffffff;
      font-size: 11px;
      padding: 4px 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }

    /* Somente na versão mobile (dispositivos móveis touch) exibimos os botões virtuais */
    body.mobile-mode #touch-controls {
      display: flex !important;
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 120px;
      pointer-events: none;
      justify-content: space-between;
      align-items: flex-end;
      padding: 10px 14px;
      z-index: 50;
    }

    body.mobile-mode #floating-mute-btn {
      display: block !important;
    }

    body.mobile-mode .touch-zone-left {
      display: block !important;
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: calc(100% - 120px);
      z-index: 20;
      touch-action: none;
    }

    body.mobile-mode .touch-zone-right {
      display: block !important;
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: calc(100% - 120px);
      z-index: 20;
      touch-action: none;
    }

    .touch-btn {
      pointer-events: auto;
      background: #c0c0c0;
      border: 3px outset #ffffff;
      color: #000000;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      touch-action: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-btn:active, .touch-btn.pressed {
      border: 3px inset #ffffff !important;
      background: #a0a0a0 !important;
      transform: translateY(2px);
    }

    .flipper-btn {
      width: 110px;
      height: 80px;
      font-size: 14px;
      line-height: 1.2;
    }
    .flipper-btn span.sub {
      font-size: 10px;
      color: #333;
      margin-top: 3px;
    }

    .plunger-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }
    .plunger-btn {
      width: 90px;
      height: 58px;
      font-size: 13px;
      background: #d4d0c8;
      border: 3px outset #ffffff;
      color: #b00000;
    }
    .newgame-btn {
      width: 90px;
      height: 32px;
      font-size: 11px;
      background: #c0c0c0;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <!-- Tela de Carregamento -->
    <div id="loading-overlay">
      <div class="loading-title">🚀 3D Pinball: Space Cadet</div>
      <div id="loading-text" class="loading-status">Carregando motor do jogo...</div>
      <div class="loading-bar-border">
        <div id="loading-fill" class="loading-bar-fill"></div>
      </div>
      <div style="font-size: 11px; color: #ddd; margin-top: 8px;">Windows 95 WebAssembly Port</div>
    </div>

    <!-- Zonas de toque invisíveis no meio da tela -->
    <div class="touch-zone-left" id="zone-left"></div>
    <div class="touch-zone-right" id="zone-right"></div>

    <!-- Canvas do Pinball -->
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <!-- Botão de Áudio Flutuante Retrô (Apenas Mobile) -->
    <button id="floating-mute-btn" onclick="toggleMute()">
      🔊 Som: ON
    </button>

    <!-- Controles Touch na Base -->
    <div id="touch-controls">
      <!-- Flipper Esquerdo -->
      <button class="touch-btn flipper-btn" id="btn-flipper-left">
        ◀ FLIPPER
        <span class="sub">[ Tecla Z ]</span>
      </button>

      <!-- Centro: Lançar Mola & Novo Jogo & Som -->
      <div class="plunger-col">
        <div style="display: flex; gap: 4px; width: 100%;">
          <button class="touch-btn newgame-btn" id="btn-newgame" style="flex: 1;">
            🔄 F2
          </button>
          <button class="touch-btn mute-btn" id="btn-pinball-mute" onclick="toggleMute()" style="flex: 1; font-size: 10px; background: #c0c0c0; border: 2px outset #ffffff; color: #000; font-weight: bold;">
            🔊 Som
          </button>
        </div>
        <button class="touch-btn plunger-btn" id="btn-plunger">
          🚀 LANÇAR
          <span style="font-size: 9px; color: #444;">[ Segure ]</span>
        </button>
      </div>

      <!-- Flipper Direito -->
      <button class="touch-btn flipper-btn" id="btn-flipper-right">
        FLIPPER ▶
        <span class="sub">[ Tecla / ]</span>
      </button>
    </div>
  </div>

  <script>
    // =========================================================================
    // DETECÇÃO DE MODO: COMPUTADOR (DESKTOP) VS SMARTPHONE (MOBILE TOUCH)
    // =========================================================================
    function checkMobileMode() {
      const urlParams = new URLSearchParams(window.location.search);
      const mode = urlParams.get('mode');
      if (mode === 'mobile') {
        document.body.classList.add('mobile-mode');
        return true;
      }
      if (mode === 'desktop') {
        document.body.classList.remove('mobile-mode');
        return false;
      }

      // Se não especificado na URL, detecta pelo tamanho da tela pai e toque
      let isMobile = false;
      try {
        if (window.parent && window.parent.innerWidth) {
          isMobile = window.parent.innerWidth <= 768;
        }
      } catch(e) {}

      if (!isMobile) {
        const isSmallScreen = window.innerWidth <= 768 || window.screen.width <= 768;
        const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 1);
        isMobile = isSmallScreen && hasTouch;
      }

      if (isMobile) {
        document.body.classList.add('mobile-mode');
      } else {
        document.body.classList.remove('mobile-mode');
      }
      return isMobile;
    }
    checkMobileMode();

    // =========================================================================
    // INTERCEPTAÇÃO E CONTROLE DE ÁUDIO SDL2/EMSCRIPTEN (MUTE / PAUSE / STOP)
    // =========================================================================
    window.pinballAudioContexts = [];
    window.pinballIsMuted = false;

    const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
    if (OriginalAudioContext) {
      const ProxyAudioContext = function(...args) {
        const ctx = new OriginalAudioContext(...args);
        window.pinballAudioContexts.push(ctx);
        window.pinballAudioContext = ctx;
        if (window.pinballIsMuted) {
          try { ctx.suspend(); } catch(e){}
        }
        return ctx;
      };
      ProxyAudioContext.prototype = OriginalAudioContext.prototype;
      window.AudioContext = ProxyAudioContext;
      window.webkitAudioContext = ProxyAudioContext;
    }

    function updateMuteUI() {
      const isMuted = window.pinballIsMuted;
      const floatBtn = document.getElementById('floating-mute-btn');
      const touchBtn = document.getElementById('btn-pinball-mute');
      if (floatBtn) {
        floatBtn.textContent = isMuted ? '🔇 MUDO' : '🔊 Som: ON';
        floatBtn.style.background = isMuted ? '#e0b0b0' : '#c0c0c0';
      }
      if (touchBtn) {
        touchBtn.textContent = isMuted ? '🔇 Mudo' : '🔊 Som';
        touchBtn.style.background = isMuted ? '#e0b0b0' : '#c0c0c0';
      }
    }

    function toggleMute(forceMute) {
      if (typeof forceMute === 'boolean') {
        window.pinballIsMuted = forceMute;
      } else {
        window.pinballIsMuted = !window.pinballIsMuted;
      }
      window.pinballAudioContexts.forEach(ctx => {
        try {
          if (window.pinballIsMuted) {
            ctx.suspend();
          } else {
            ctx.resume();
          }
        } catch(e) {}
      });
      updateMuteUI();
      return window.pinballIsMuted;
    }
    window.toggleMute = toggleMute;

    function stopPinballAudio() {
      window.pinballIsMuted = true;
      window.pinballAudioContexts.forEach(ctx => {
        try { ctx.suspend(); } catch(e) {}
        try { ctx.close(); } catch(e) {}
      });
      updateMuteUI();
    }
    window.stopPinballAudio = stopPinballAudio;

    // Pausar áudio quando a aba não estiver visível
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        window.pinballAudioContexts.forEach(ctx => { try { ctx.suspend(); } catch(e){} });
      } else if (!window.pinballIsMuted) {
        window.pinballAudioContexts.forEach(ctx => { try { ctx.resume(); } catch(e){} });
      }
    });

    // Comunicação com a janela pai do Windows 95
    window.addEventListener('message', (e) => {
      if (e.data === 'mute' || e.data === 'pause') {
        toggleMute(true);
      } else if (e.data === 'unmute' || e.data === 'resume') {
        toggleMute(false);
      } else if (e.data === 'stop') {
        stopPinballAudio();
      }
    });

    // =========================================================================
    // DISPATCHER DE TECLAS EMSCRIPTEN (SIMULA ENTRADA DE TECLADO REAL)
    // =========================================================================
    function sendKey(key, code, keyCode, isDown) {
      const type = isDown ? 'keydown' : 'keyup';
      const evt = new KeyboardEvent(type, {
        key: key,
        code: code,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true,
        cancelable: true
      });

      const canvas = document.getElementById('canvas');
      if (canvas) canvas.dispatchEvent(evt);
      window.dispatchEvent(evt);
      document.dispatchEvent(evt);
    }

    // Ações do Jogo
    function leftFlipper(down) {
      sendKey('z', 'KeyZ', 90, down);
      const btn = document.getElementById('btn-flipper-left');
      if (btn) btn.classList.toggle('pressed', down);
    }

    function rightFlipper(down) {
      sendKey('/', 'Slash', 191, down);
      const btn = document.getElementById('btn-flipper-right');
      if (btn) btn.classList.toggle('pressed', down);
    }

    function plunger(down) {
      sendKey(' ', 'Space', 32, down);
      const btn = document.getElementById('btn-plunger');
      if (btn) btn.classList.toggle('pressed', down);
    }

    function newGame() {
      sendKey('F2', 'F2', 113, true);
      setTimeout(() => sendKey('F2', 'F2', 113, false), 80);
    }

    // =========================================================================
    // TOUCH EVENT LISTENERS COM MULTI-TOQUE SIMULTÂNEO
    // =========================================================================
    function bindTouchAction(el, onDown, onUp) {
      if (!el) return;
      el.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
        onDown();
      }, { passive: false });

      el.addEventListener('touchend', (e) => {
        e.preventDefault();
        e.stopPropagation();
        onUp();
      }, { passive: false });

      el.addEventListener('touchcancel', (e) => {
        e.preventDefault();
        e.stopPropagation();
        onUp();
      }, { passive: false });

      // Suporte para mouse também
      el.addEventListener('mousedown', (e) => {
        e.preventDefault();
        onDown();
      });
      el.addEventListener('mouseup', (e) => {
        e.preventDefault();
        onUp();
      });
      el.addEventListener('mouseleave', () => onUp());
    }

    // Botões físicos na tela
    bindTouchAction(document.getElementById('btn-flipper-left'), () => leftFlipper(true), () => leftFlipper(false));
    bindTouchAction(document.getElementById('btn-flipper-right'), () => rightFlipper(true), () => rightFlipper(false));
    bindTouchAction(document.getElementById('btn-plunger'), () => plunger(true), () => plunger(false));

    const btnNewGame = document.getElementById('btn-newgame');
    if (btnNewGame) {
      btnNewGame.addEventListener('click', (e) => { e.preventDefault(); newGame(); });
      btnNewGame.addEventListener('touchend', (e) => { e.preventDefault(); newGame(); });
    }

    // Zonas de toque superiores na tela (metade esquerda e direita)
    bindTouchAction(document.getElementById('zone-left'), () => leftFlipper(true), () => leftFlipper(false));
    bindTouchAction(document.getElementById('zone-right'), () => rightFlipper(true), () => rightFlipper(false));

    // =========================================================================
    // CONFIGURAÇÃO EMSCRIPTEN DO SPACE CADET PINBALL
    // =========================================================================
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');
    const loadingFill = document.getElementById('loading-fill');

    var Module = {
      preRun: [],
      postRun: [
        function() {
          console.log("PINBALL WASM ENGINE STARTED!");
          document.title = "PINBALL_READY";
          if (loadingOverlay) loadingOverlay.style.display = 'none';
        }
      ],
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); },
      canvas: (function() {
        var canvas = document.getElementById('canvas');
        canvas.addEventListener('webglcontextlost', function(e) {
          alert('WebGL perdido. Recarregue a página.');
          e.preventDefault();
        }, false);
        return canvas;
      })(),
      setStatus: function(text) {
        if (!text) {
          if (loadingOverlay) loadingOverlay.style.display = 'none';
          return;
        }
        if (loadingText) loadingText.textContent = text;
        const match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (match && loadingFill) {
          const current = parseFloat(match[2]);
          const total = parseFloat(match[4]);
          loadingFill.style.width = `${Math.min(100, Math.round((current / total) * 100))}%`;
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Carregando recursos (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')...' : '');
      }
    };

    Module.setStatus('Iniciando Space Cadet...');
  </script>
  <script async src="SpaceCadetPinball.js"></script>
</body>
</html>
